appId: com.nick2191.fawtboard
productName: fawtboard
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
# Build the plugin first (npm run pack -w @fawtboard/streamdeck-plugin); the app offers it to
# Stream Deck when the installed plugin is older.
extraResources:
  - from: ../streamdeck-plugin/dist/com.nick2191.fawtboard.streamDeckPlugin
    to: com.nick2191.fawtboard.streamDeckPlugin
# Where electron-updater looks for new versions. The release workflow uploads the files.
publish:
  provider: github
  owner: Nick2191
  repo: fawtboard
win:
  executableName: fawtboard
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: fawtboard-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSMicrophoneUsageDescription: fawtboard reads audio device names to route sounds.
  notarize: false
dmg:
  artifactName: fawtboard-${version}.${ext}
linux:
  target:
    - AppImage
  maintainer: nick2191
  category: Audio
appImage:
  artifactName: fawtboard-${version}.${ext}
npmRebuild: false
